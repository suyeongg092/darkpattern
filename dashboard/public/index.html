<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안심해지</title>
<style>
  :root {
    --bg: #0a0c0f;
    --surface: #111417;
    --surface-2: #191d22;
    --border: #23282f;
    --ink: #e9ebee;
    --ink-2: #9aa1ab;
    --muted: #5c6470;
    --accent: #2dd4bf;
    --accent-weak: rgba(45,212,191,.12);
    --success: #34d399;
    --success-weak: rgba(52,211,153,.12);
    --warning: #f5a524;
    --warning-weak: rgba(245,165,36,.12);
    --danger: #f24957;
    --danger-weak: rgba(242,73,87,.14);
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard,
      "Apple SD Gothic Neo", "Malgun Gothic", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); margin: 0;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px 60px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px;
  }
  .brand-row { display: flex; align-items: center; gap: 10px; }
  .wordmark { font-size: 14px; font-weight: 800; color: var(--ink); letter-spacing: -0.1px; }
  .status-pill {
    font-size: 10.5px; font-weight: 700; color: var(--success); background: var(--success-weak);
    padding: 3px 9px; border-radius: 999px; display: flex; align-items: center; gap: 5px;
  }
  .status-pill .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--success); }
  .session-box { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
  .reset-link {
    font-size: 12px; color: var(--ink-2); background: none; border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  .reset-link:hover { border-color: var(--accent); color: var(--accent); }

  .page-head { padding: 4px 0 20px; }
  .page-title { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; }
  .page-sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }
  .summary-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
  }
  .summary-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .summary-value { font-size: 19px; font-weight: 800; margin-top: 5px; letter-spacing: -0.2px; color: var(--accent); }
  .summary-value.small { font-size: 14px; color: var(--ink); }

  .layout { display: grid; grid-template-columns: 1.05fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .section-label {
    font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
    margin: 0 0 10px 2px;
  }

  .list {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden;
  }
  .row { padding: 16px 16px; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: none; }

  .row-top { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 38px; height: 38px; border-radius: 10px; flex: none;
    color: #071012; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px;
  }
  .row-id { flex: 1; min-width: 0; }
  .row-name { font-weight: 700; font-size: 14px; }
  .row-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .row-right { text-align: right; }
  .dday {
    font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 6px;
    background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border);
  }
  .dday.urgent { background: var(--danger-weak); color: var(--danger); border-color: transparent; }
  .row-cancelled-tag { font-size: 11px; color: var(--muted); }

  .insight { margin-top: 10px; font-size: 12px; color: var(--ink-2); padding: 8px 10px; background: var(--surface-2); border-radius: 8px; border-left: 2px solid var(--accent); }
  .note-line { margin-top: 6px; font-size: 11px; color: var(--warning); }

  .actions { margin-top: 12px; display: flex; align-items: center; gap: 16px; }
  .btn-primary {
    font-size: 12px; font-weight: 700; padding: 8px 14px; border-radius: 7px;
    border: 1px solid var(--accent); background: var(--accent); color: #06201d; cursor: pointer;
  }
  .btn-primary:disabled { opacity: .3; cursor: default; }
  .btn-primary:hover:not(:disabled) { background: #26c4b0; }
  .link-danger {
    font-size: 12px; font-weight: 600; color: var(--danger); background: none; border: none;
    cursor: pointer; padding: 0; opacity: .9;
  }
  .link-danger:hover:not(:disabled) { text-decoration: underline; }
  .link-danger:disabled { opacity: .3; cursor: default; }

  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; min-height: 320px; position: sticky; top: 20px;
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .panel-title { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-2); }
  .panel-sub { font-size: 11.5px; color: var(--muted); margin-bottom: 14px; }

  .placeholder { font-size: 12.5px; color: var(--muted); line-height: 1.6; padding: 4px 2px; }

  .screen {
    width: 100%; aspect-ratio: 3 / 2; border-radius: 8px; background: #000;
    border: 1px solid var(--border);
    margin-bottom: 14px; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .screen img { width: 100%; height: 100%; object-fit: contain; display: none; }
  .screen img.on { display: block; }
  .screen-placeholder { color: var(--muted); font-size: 12px; text-align: center; padding: 0 20px; line-height: 1.6; }
  .screen-badge {
    position: absolute; top: 8px; left: 8px; font-size: 10px; font-weight: 700; color: #fff;
    background: rgba(242,73,87,.92); padding: 3px 8px; border-radius: 4px; display: none;
    align-items: center; gap: 4px;
  }
  .screen-badge.on { display: flex; }
  .screen-badge .live-dot { background: #fff; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .2; } }

  .steps { position: relative; }
  .step { display: flex; gap: 10px; padding-bottom: 14px; position: relative; }
  .step:not(:last-child)::before {
    content: ""; position: absolute; left: 9px; top: 22px; bottom: -2px; width: 1.5px;
    background: var(--border);
  }
  .step-icon {
    width: 19px; height: 19px; border-radius: 4px; flex: none; margin-top: 1px;
    display: flex; align-items: center; justify-content: center; font-size: 11px;
    background: var(--surface-2); color: var(--muted); font-weight: 700; border: 1px solid var(--border);
  }
  .step-icon.ok { background: var(--success-weak); color: var(--success); border-color: transparent; }
  .step-icon.bad { background: var(--danger-weak); color: var(--danger); border-color: transparent; }
  .step-body { flex: 1; min-width: 0; }
  .step-label { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .step-detail {
    margin-top: 3px; font-size: 11px; color: var(--ink-2); word-break: break-all;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; line-height: 1.5;
    background: var(--surface-2); border-radius: 6px; padding: 5px 8px; border: 1px solid var(--border);
  }
  .step-waiting { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .ring {
    width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border);
    border-top-color: var(--accent); animation: spin .7s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .verdict {
    margin-top: 8px; padding: 12px 14px; border-radius: 8px; font-size: 12.5px; line-height: 1.5;
    border: 1px solid transparent;
  }
  .verdict-title { font-weight: 800; font-size: 13px; margin-bottom: 2px; }
  .verdict-ok { background: var(--success-weak); color: var(--success); }
  .verdict-blocked { background: var(--warning-weak); color: var(--warning); }
  .verdict-violation { background: var(--danger-weak); color: var(--danger); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand-row">
      <div class="wordmark">안심해지</div>
      <div class="status-pill"><span class="dot"></span>모니터링 중</div>
    </div>
    <div class="session-box">
      <span id="sessionLabel" class="mono"></span>
      <button class="reset-link" id="resetBtn">새 세션</button>
    </div>
  </div>

  <div class="page-head">
    <div class="page-title">구독 무결성 모니터링</div>
    <div class="page-sub">다크패턴 뚫고, 위조는 잡아내는 AI 해지 Agent</div>
  </div>

  <div class="summary" id="summary">
    <div class="summary-box">
      <div class="summary-label">이번 달 구독료</div>
      <div class="summary-value" id="summaryTotal">-</div>
    </div>
    <div class="summary-box">
      <div class="summary-label">다가오는 결제</div>
      <div class="summary-value small" id="summarySoonest">-</div>
    </div>
  </div>

  <div class="layout">
    <div>
      <div class="section-label" id="sectionTitle">내 구독</div>
      <div class="list" id="cards">
        <div class="row"><div class="placeholder">불러오는 중...</div></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">실행 화면 + 파이프라인</div>
      </div>
      <div class="panel-sub">Agent가 실제로 보고 있는 화면과 판단 단계를 그대로 보여줍니다</div>
      <div class="screen" id="screen">
        <div class="screen-badge" id="screenBadge"><span class="live-dot"></span>실시간</div>
        <img id="screenImg" alt="agent live view">
        <div class="screen-placeholder" id="screenPlaceholder">실행을 누르면<br>여기에 실제 다크패턴 사이트 화면이<br>실시간으로 나타납니다</div>
      </div>
      <div id="logPanel">
        <div class="placeholder">왼쪽 목록에서 "AI Agent로 해지하기" 또는 "공격 시뮬레이션"을 눌러보세요.</div>
      </div>
    </div>
  </div>
</div>

<script>
let uid = localStorage.getItem('dp_uid');
if (!uid) {
  uid = 'demo-' + Date.now();
  localStorage.setItem('dp_uid', uid);
}
document.getElementById('sessionLabel').textContent = '세션 · ' + uid.slice(-10);

document.getElementById('resetBtn').addEventListener('click', () => {
  uid = 'demo-' + Date.now();
  localStorage.setItem('dp_uid', uid);
  document.getElementById('sessionLabel').textContent = '세션 · ' + uid.slice(-10);
  loadSubscriptions();
});

async function loadSubscriptions() {
  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = '<div class="row"><div class="placeholder">불러오는 중...</div></div>';
  const res = await fetch('/api/subscriptions?uid=' + encodeURIComponent(uid));
  const data = await res.json();
  if (data.error) {
    cardsEl.innerHTML = '<div class="row"><div class="placeholder">' + data.error + '</div></div>';
    return;
  }
  cardsEl.innerHTML = '';
  for (const s of data.subscriptions) {
    cardsEl.appendChild(renderRow(s));
  }
  document.getElementById('sectionTitle').textContent = `내 구독 (${data.subscriptions.length})`;
  document.getElementById('summaryTotal').textContent = data.summary.totalMonthly.toLocaleString() + '원';
  document.getElementById('summarySoonest').textContent = data.summary.soonest
    ? `${data.summary.soonest.name} · ${data.summary.soonest.daysUntilBilling}일 뒤`
    : '없음';
}

function initials(name) {
  return name.replace(/[^A-Za-z]/g, '').slice(0, 2).toUpperCase() || name[0];
}

function renderRow(s) {
  const div = document.createElement('div');
  div.className = 'row';
  const isActive = s.status === 'active';
  const urgent = isActive && s.daysUntilBilling <= 3;
  const rightHtml = isActive
    ? `<span class="dday ${urgent ? 'urgent' : ''}">${s.daysUntilBilling === 0 ? '오늘 결제' : s.daysUntilBilling + '일 뒤'}</span>`
    : `<span class="row-cancelled-tag">해지완료</span>`;
  div.innerHTML = `
    <div class="row-top">
      <div class="avatar" style="background:${s.accent}">${initials(s.name)}</div>
      <div class="row-id">
        <div class="row-name">${s.name}</div>
        <div class="row-sub">${s.price.toLocaleString()}원 · 월간 · 이번 달 ${s.usageThisMonth}회 사용</div>
      </div>
      <div class="row-right">${rightHtml}</div>
    </div>
    ${s.suggestionText ? `<div class="insight">💡 ${s.suggestionText}</div>` : ''}
    ${s.note ? `<div class="note-line">최근 처리 기록 · ${s.note}</div>` : ''}
    <div class="actions">
      <button class="btn-primary" data-service="${s.path}" data-attack="0" ${!isActive ? 'disabled' : ''}>AI Agent로 해지하기</button>
      <button class="link-danger" data-service="${s.path}" data-attack="1" ${!isActive ? 'disabled' : ''}>공격 시뮬레이션으로 테스트</button>
    </div>
  `;
  div.querySelectorAll('button[data-service]').forEach((btn) => {
    btn.addEventListener('click', () => runAgent(s.path, btn.dataset.attack === '1', div));
  });
  return div;
}

function runAgent(service, attack, rowEl) {
  const logPanel = document.getElementById('logPanel');
  const screenImg = document.getElementById('screenImg');
  const screenPlaceholder = document.getElementById('screenPlaceholder');
  const screenBadge = document.getElementById('screenBadge');
  const buttons = rowEl.querySelectorAll('button');
  buttons.forEach((b) => (b.disabled = true));

  screenImg.classList.remove('on');
  screenPlaceholder.style.display = 'block';
  screenPlaceholder.textContent = '연결 중...';
  screenBadge.classList.add('on');

  logPanel.innerHTML = '';
  const stepsEl = document.createElement('div');
  stepsEl.className = 'steps';
  logPanel.appendChild(stepsEl);
  const waitingEl = document.createElement('div');
  waitingEl.className = 'step-waiting';
  waitingEl.innerHTML = '<span class="ring"></span>Agent 연결 중...';
  logPanel.appendChild(waitingEl);

  const qs = new URLSearchParams({ service, uid, attack: attack ? '1' : '0' });
  const es = new EventSource('/api/run-stream?' + qs.toString());

  es.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.type === 'frame') {
      screenPlaceholder.style.display = 'none';
      screenImg.src = 'data:image/jpeg;base64,' + msg.data;
      screenImg.classList.add('on');
    } else if (msg.type === 'log') {
      const step = document.createElement('div');
      step.className = 'step';
      const isBad = /🛑/.test(msg.step);
      const isGood = /✅/.test(msg.step);
      const iconClass = isBad ? 'bad' : isGood ? 'ok' : '';
      const iconGlyph = isBad ? '✕' : isGood ? '✓' : '';
      step.innerHTML = `
        <div class="step-icon ${iconClass}">${iconGlyph}</div>
        <div class="step-body">
          <div class="step-label">${escapeHtml(msg.step.replace(/^\d+\.\s*/, '').replace(/[🛑✅]\s*/, ''))}</div>
          ${msg.detail ? `<div class="step-detail">${escapeHtml(msg.detail)}</div>` : ''}
        </div>`;
      stepsEl.appendChild(step);
      waitingEl.innerHTML = '<span class="ring"></span>다음 단계 진행 중...';
      logPanel.appendChild(waitingEl); // keep waiting indicator at bottom
    } else if (msg.type === 'verdict') {
      waitingEl.remove();
      const verdictEl = document.createElement('div');
      const v = msg.verdict;
      if (v.blocked) {
        verdictEl.className = 'verdict verdict-blocked';
        verdictEl.innerHTML = `<div class="verdict-title">실행 전 자동 차단됨</div>${escapeHtml(v.reason)}`;
      } else if (v.integrityViolation) {
        verdictEl.className = 'verdict verdict-violation';
        verdictEl.innerHTML = `<div class="verdict-title">무결성 위반 탐지됨</div>${escapeHtml(v.reason)}`;
      } else {
        verdictEl.className = 'verdict verdict-ok';
        verdictEl.innerHTML = `<div class="verdict-title">정상 처리 완료</div>무결성 검증 통과 · ${v.durationMs}ms`;
      }
      logPanel.appendChild(verdictEl);
    } else if (msg.type === 'error') {
      waitingEl.remove();
      const errEl = document.createElement('div');
      errEl.className = 'placeholder';
      errEl.textContent = '오류: ' + msg.message;
      logPanel.appendChild(errEl);
    } else if (msg.type === 'done') {
      screenBadge.classList.remove('on');
      es.close();
      loadSubscriptions();
    }
  };

  es.onerror = () => {
    waitingEl.remove();
    screenBadge.classList.remove('on');
    es.close();
  };
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

loadSubscriptions();
</script>
</body>
</html>
