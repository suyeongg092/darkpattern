<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안심해지</title>
<style>
  :root {
    --bg: #f7f7f8;
    --surface: #ffffff;
    --ink: #16181d;
    --ink-2: #5b6169;
    --muted: #93989f;
    --line: #eceef1;
    --brand: #2f6fed;
    --success: #1a9c72;
    --warning: #b5690b;
    --danger: #d1373f;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard,
      "Apple SD Gothic Neo", "Malgun Gothic", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); margin: 0;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px 60px; }

  .topbar {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 28px 0 24px; border-bottom: 1px solid var(--line); margin-bottom: 24px;
  }
  .wordmark { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
  .tagline { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .session-box { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  .reset-link {
    font-size: 12px; color: var(--ink-2); background: none; border: none;
    text-decoration: underline; cursor: pointer; padding: 0;
  }

  .layout { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .section-label {
    font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.04em; margin: 0 0 10px 2px;
  }

  .list {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden;
  }
  .row { padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }

  .row-top { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 36px; height: 36px; border-radius: 10px; flex: none;
    background: #f0f1f3; color: var(--ink-2);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
  }
  .row-id { flex: 1; min-width: 0; }
  .row-name { font-weight: 700; font-size: 14.5px; }
  .row-status { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); margin-top: 1px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .dot-active { background: var(--success); }
  .row-price { text-align: right; }
  .row-amount { font-weight: 700; font-size: 14.5px; }
  .row-usage { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

  .insight {
    margin-top: 12px; padding: 10px 12px; border-left: 2px solid var(--brand);
    background: #f7faff; border-radius: 0 8px 8px 0; font-size: 12.5px; color: #24406e;
    line-height: 1.5;
  }
  .note-line {
    margin-top: 8px; font-size: 11.5px; color: var(--warning);
  }

  .actions { margin-top: 12px; display: flex; align-items: center; gap: 16px; }
  .btn-primary {
    font-size: 12.5px; font-weight: 700; padding: 8px 14px; border-radius: 8px;
    border: none; background: var(--ink); color: #fff; cursor: pointer;
  }
  .btn-primary:disabled { opacity: .35; cursor: default; }
  .btn-primary:hover:not(:disabled) { background: #000; }
  .link-secondary {
    font-size: 12px; color: var(--warning); background: none; border: none;
    cursor: pointer; padding: 0; text-decoration: none; opacity: .85;
  }
  .link-secondary:hover:not(:disabled) { text-decoration: underline; }
  .link-secondary:disabled { opacity: .3; cursor: default; }

  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px 20px; min-height: 320px; position: sticky; top: 20px;
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .panel-title { font-size: 13px; font-weight: 700; }
  .panel-sub { font-size: 11.5px; color: var(--muted); margin-bottom: 14px; }
  .live-tag {
    font-size: 10.5px; font-weight: 700; color: var(--danger); display: none;
    align-items: center; gap: 5px;
  }
  .live-tag.on { display: flex; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--danger); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .2; } }

  .placeholder { font-size: 12.5px; color: var(--muted); line-height: 1.6; padding: 4px 2px; }

  .steps { position: relative; }
  .step { display: flex; gap: 10px; padding-bottom: 14px; position: relative; }
  .step:not(:last-child)::before {
    content: ""; position: absolute; left: 9px; top: 22px; bottom: -2px; width: 1.5px;
    background: var(--line);
  }
  .step-icon {
    width: 19px; height: 19px; border-radius: 50%; flex: none; margin-top: 1px;
    display: flex; align-items: center; justify-content: center; font-size: 11px;
    background: #eef0f3; color: var(--muted); font-weight: 700;
  }
  .step-icon.ok { background: #e5f5ef; color: var(--success); }
  .step-icon.bad { background: #fbe9ea; color: var(--danger); }
  .step-icon.pending {
    background: transparent; border: 1.5px solid var(--line);
  }
  .step-body { flex: 1; min-width: 0; }
  .step-label { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .step-detail {
    margin-top: 3px; font-size: 11px; color: var(--ink-2); word-break: break-all;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; line-height: 1.5;
    background: #f7f7f8; border-radius: 6px; padding: 5px 8px;
  }
  .step-waiting { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .ring {
    width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line);
    border-top-color: var(--brand); animation: spin .7s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .verdict {
    margin-top: 8px; padding: 12px 14px; border-radius: 10px; font-size: 12.5px; line-height: 1.5;
  }
  .verdict-title { font-weight: 800; font-size: 13px; margin-bottom: 2px; }
  .verdict-ok { background: #e5f5ef; color: #0f7a58; }
  .verdict-blocked { background: #fdf2e2; color: var(--warning); }
  .verdict-violation { background: #fbe9ea; color: var(--danger); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="wordmark">안심해지</div>
      <div class="tagline">다크패턴 뚫고, 위조는 잡아내는 AI 해지 Agent</div>
    </div>
    <div class="session-box">
      <span id="sessionLabel"></span>
      <button class="reset-link" id="resetBtn">새 데모 세션</button>
    </div>
  </div>

  <div class="layout">
    <div>
      <div class="section-label" id="sectionTitle">내 구독</div>
      <div class="list" id="cards">
        <div class="row"><div class="placeholder">불러오는 중...</div></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">실행 파이프라인</div>
        <div class="live-tag" id="liveTag"><span class="live-dot"></span>LIVE</div>
      </div>
      <div class="panel-sub">Agent가 실제로 수행하는 각 단계를 실시간으로 표시합니다</div>
      <div id="logPanel">
        <div class="placeholder">왼쪽 목록에서 "AI Agent로 해지하기" 또는 "공격 시뮬레이션 테스트"를 눌러보세요.</div>
      </div>
    </div>
  </div>
</div>

<script>
let uid = localStorage.getItem('dp_uid');
if (!uid) {
  uid = 'demo-' + Date.now();
  localStorage.setItem('dp_uid', uid);
}
document.getElementById('sessionLabel').textContent = 'session · ' + uid.slice(-10);

document.getElementById('resetBtn').addEventListener('click', () => {
  uid = 'demo-' + Date.now();
  localStorage.setItem('dp_uid', uid);
  document.getElementById('sessionLabel').textContent = 'session · ' + uid.slice(-10);
  loadSubscriptions();
});

async function loadSubscriptions() {
  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = '<div class="row"><div class="placeholder">불러오는 중...</div></div>';
  const res = await fetch('/api/subscriptions?uid=' + encodeURIComponent(uid));
  const data = await res.json();
  if (data.error) {
    cardsEl.innerHTML = '<div class="row"><div class="placeholder">' + data.error + '</div></div>';
    return;
  }
  cardsEl.innerHTML = '';
  for (const s of data.subscriptions) {
    cardsEl.appendChild(renderRow(s));
  }
  document.getElementById('sectionTitle').textContent = `내 구독 (${data.subscriptions.length})`;
}

function initials(name) {
  return name.replace(/[^A-Za-z]/g, '').slice(0, 2).toUpperCase() || name[0];
}

function renderRow(s) {
  const div = document.createElement('div');
  div.className = 'row';
  const dotClass = s.status === 'active' ? 'dot dot-active' : 'dot';
  const statusLabel = s.status === 'active' ? '이용중' : '해지완료';
  div.innerHTML = `
    <div class="row-top">
      <div class="avatar">${initials(s.name)}</div>
      <div class="row-id">
        <div class="row-name">${s.name}</div>
        <div class="row-status"><span class="${dotClass}"></span>${statusLabel}</div>
      </div>
      <div class="row-price">
        <div class="row-amount">${s.price.toLocaleString()}원</div>
        <div class="row-usage">이번 달 ${s.usageThisMonth}회 사용</div>
      </div>
    </div>
    ${s.suggestionText ? `<div class="insight">${s.suggestionText}</div>` : ''}
    ${s.note ? `<div class="note-line">최근 처리 기록 · ${s.note}</div>` : ''}
    <div class="actions">
      <button class="btn-primary" data-service="${s.path}" data-attack="0" ${s.status !== 'active' ? 'disabled' : ''}>AI Agent로 해지하기</button>
      <button class="link-secondary" data-service="${s.path}" data-attack="1" ${s.status !== 'active' ? 'disabled' : ''}>공격 시뮬레이션 테스트</button>
    </div>
  `;
  div.querySelectorAll('button[data-service]').forEach((btn) => {
    btn.addEventListener('click', () => runAgent(s.path, btn.dataset.attack === '1', div));
  });
  return div;
}

function runAgent(service, attack, rowEl) {
  const logPanel = document.getElementById('logPanel');
  const liveTag = document.getElementById('liveTag');
  const buttons = rowEl.querySelectorAll('button');
  buttons.forEach((b) => (b.disabled = true));

  logPanel.innerHTML = '';
  const stepsEl = document.createElement('div');
  stepsEl.className = 'steps';
  logPanel.appendChild(stepsEl);
  const waitingEl = document.createElement('div');
  waitingEl.className = 'step-waiting';
  waitingEl.innerHTML = '<span class="ring"></span>Agent 연결 중...';
  logPanel.appendChild(waitingEl);
  liveTag.classList.add('on');

  const qs = new URLSearchParams({ service, uid, attack: attack ? '1' : '0' });
  const es = new EventSource('/api/run-stream?' + qs.toString());

  es.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.type === 'log') {
      const step = document.createElement('div');
      step.className = 'step';
      const isBad = /🛑/.test(msg.step);
      const isGood = /✅/.test(msg.step);
      const iconClass = isBad ? 'bad' : isGood ? 'ok' : '';
      const iconGlyph = isBad ? '✕' : isGood ? '✓' : '';
      step.innerHTML = `
        <div class="step-icon ${iconClass}">${iconGlyph}</div>
        <div class="step-body">
          <div class="step-label">${escapeHtml(msg.step.replace(/^\d+\.\s*/, '').replace(/[🛑✅]\s*/, ''))}</div>
          ${msg.detail ? `<div class="step-detail">${escapeHtml(msg.detail)}</div>` : ''}
        </div>`;
      stepsEl.appendChild(step);
      waitingEl.innerHTML = '<span class="ring"></span>다음 단계 진행 중...';
      logPanel.appendChild(waitingEl); // keep waiting indicator at bottom
    } else if (msg.type === 'verdict') {
      waitingEl.remove();
      const verdictEl = document.createElement('div');
      const v = msg.verdict;
      if (v.blocked) {
        verdictEl.className = 'verdict verdict-blocked';
        verdictEl.innerHTML = `<div class="verdict-title">실행 전 자동 차단됨</div>${escapeHtml(v.reason)}`;
      } else if (v.integrityViolation) {
        verdictEl.className = 'verdict verdict-violation';
        verdictEl.innerHTML = `<div class="verdict-title">무결성 위반 탐지됨</div>${escapeHtml(v.reason)}`;
      } else {
        verdictEl.className = 'verdict verdict-ok';
        verdictEl.innerHTML = `<div class="verdict-title">정상 처리 완료</div>무결성 검증 통과 · ${v.durationMs}ms`;
      }
      logPanel.appendChild(verdictEl);
    } else if (msg.type === 'error') {
      waitingEl.remove();
      const errEl = document.createElement('div');
      errEl.className = 'placeholder';
      errEl.textContent = '오류: ' + msg.message;
      logPanel.appendChild(errEl);
    } else if (msg.type === 'done') {
      liveTag.classList.remove('on');
      es.close();
      loadSubscriptions();
    }
  };

  es.onerror = () => {
    waitingEl.remove();
    liveTag.classList.remove('on');
    es.close();
  };
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

loadSubscriptions();
</script>
</body>
</html>
