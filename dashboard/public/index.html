<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해지하마</title>
<link rel="icon" type="image/png" href="/icon01.png">
<style>
  :root {
    --bg: #faf8f4;
    --surface: #ffffff;
    --surface-2: #f2ede1;
    --border: #e2dbc9;
    --ink: #241f18;
    --ink-2: #55503f;
    --muted: #766e5c;
    --accent: #0f9c8a;
    --accent-weak: rgba(15,156,138,.12);
    --success: #12915a;
    --success-weak: rgba(18,145,90,.12);
    --warning: #b3690a;
    --warning-weak: rgba(179,105,10,.12);
    --danger: #d1293f;
    --danger-weak: rgba(209,41,63,.13);
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard,
      "Apple SD Gothic Neo", "Malgun Gothic", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); margin: 0;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px 60px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px;
  }
  .brand-row { display: flex; align-items: center; gap: 10px; }
  .wordmark { font-size: 14px; font-weight: 800; color: var(--ink); letter-spacing: -0.1px; }
  .status-pill {
    font-size: 10.5px; font-weight: 700; color: var(--success); background: var(--success-weak);
    padding: 3px 9px; border-radius: 999px; display: flex; align-items: center; gap: 5px;
  }
  .status-pill .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--success); }
  .session-box { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
  .reset-link {
    font-size: 12px; color: var(--ink-2); background: none; border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  .reset-link:hover { border-color: var(--accent); color: var(--accent); }

  .page-head { padding: 4px 0 20px; }
  .page-title { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; }
  .page-sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }
  .summary-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
  }
  .summary-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .summary-value { font-size: 19px; font-weight: 800; margin-top: 5px; letter-spacing: -0.2px; color: var(--accent); }
  .summary-value.small { font-size: 14px; color: var(--ink); }

  .section-label {
    font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
    margin: 0 0 10px 2px;
  }

  .list {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden;
  }
  .row { padding: 16px 16px; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: none; }

  .row-top { display: flex; align-items: center; gap: 12px; }
  .row-link {
    display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0;
    text-decoration: none; color: inherit;
  }
  .avatar {
    width: 38px; height: 38px; border-radius: 10px; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .avatar svg { width: 19px; height: 19px; }
  .row-id { flex: 1; min-width: 0; }
  .row-name { font-weight: 700; font-size: 14px; }
  .row-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .row-go { color: var(--border); font-size: 20px; line-height: 1; flex: none; }
  .row-right { text-align: right; flex: none; }
  .dday {
    font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 6px;
    background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border);
  }
  .dday.urgent { background: var(--danger-weak); color: var(--danger); border-color: transparent; }
  .row-status-tag { font-size: 11px; color: var(--muted); font-weight: 600; }

  .insight { margin-top: 8px; font-size: 12px; color: var(--ink-2); }
  .note-line { margin-top: 6px; font-size: 11px; color: var(--warning); }

  .actions { margin-top: 12px; }
  .site-link {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
    padding: 8px 14px; border-radius: 7px; border: 1px solid var(--accent);
    background: var(--accent); color: #06201d; text-decoration: none;
  }
  .site-link:hover { background: #26c4b0; }

  .placeholder { font-size: 12.5px; color: var(--muted); line-height: 1.6; padding: 4px 2px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 28px 24px; max-width: 360px; text-align: center;
  }
  .modal-mascot { font-size: 44px; margin-bottom: 10px; }
  .modal-title { font-size: 14px; line-height: 1.6; color: var(--ink); margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 10px; justify-content: center; }
  .modal-actions .btn-primary {
    flex: 1; padding: 10px 14px; font-size: 12px; font-weight: 700; border-radius: 7px;
    border: 1px solid var(--accent); background: var(--accent); color: #06201d; cursor: pointer;
    text-decoration: none; display: flex; align-items: center; justify-content: center;
  }
  .modal-actions .ghost-btn {
    flex: 1; justify-content: center; padding: 10px 14px; font-size: 12px; color: var(--ink-2);
    background: none; border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
    display: flex; align-items: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand-row">
      <img src="/icon01.png" alt="해지하마" style="width:28px;height:28px;border-radius:7px;">
      <div class="wordmark">해지하마</div>
      <div class="status-pill"><span class="dot"></span>모니터링 중</div>
    </div>
    <div class="session-box">
      <span id="sessionLabel" class="mono"></span>
      <button class="reset-link" id="resetBtn">새 세션</button>
    </div>
  </div>

  <div class="page-head">
    <div class="page-title">구독 무결성 모니터링</div>
    <div class="page-sub">다크패턴 뚫고, 위조는 잡아내는 AI 해지 Agent</div>
  </div>

  <div class="summary" id="summary">
    <div class="summary-box">
      <div class="summary-label">이번 달 구독료</div>
      <div class="summary-value" id="summaryTotal">-</div>
    </div>
    <div class="summary-box">
      <div class="summary-label">다가오는 결제</div>
      <div class="summary-value small" id="summarySoonest">-</div>
    </div>
  </div>

  <div class="section-label" id="sectionTitle">내 구독</div>
  <div class="list" id="cards">
    <div class="row"><div class="placeholder">불러오는 중...</div></div>
  </div>
</div>

<div class="modal-overlay hidden" id="suggestModal">
  <div class="modal-box">
    <div class="modal-mascot">🦛</div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-actions">
      <a class="btn-primary" id="modalYesBtn" href="#">해지하러 가기</a>
      <button class="ghost-btn" id="modalNoBtn">괜찮아요</button>
    </div>
  </div>
</div>

<script>
const ICONS = {
  'streamnow': '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4.5a1 1 0 0 1 1.5-.87l12 7.5a1 1 0 0 1 0 1.74l-12 7.5A1 1 0 0 1 5 19.5v-15Z"/></svg>',
  'ordernow-club': '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 8h9l1.2 11.2a2 2 0 0 1-2 2.1H8.3a2 2 0 0 1-2-2.1L7.5 8Z"/><path d="M9 8a3 3 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  'supercart-plus': '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.2 9h11.6l-1 9.8a2.2 2.2 0 0 1-2.2 2H9.4a2.2 2.2 0 0 1-2.2-2L6.2 9Z"/><path d="M9 9a3 3 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9.5" cy="21.2" r="1"/><circle cx="15.5" cy="21.2" r="1"/></svg>',
  'primevault': '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 4.5 6v6.2c0 5 3.2 8.6 7.5 9.8 4.3-1.2 7.5-4.8 7.5-9.8V6L12 2.5Z"/><path d="M9.2 12.3l2 2.1 3.6-4.1" fill="none" stroke="var(--surface)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  'cloudstudio': '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 17a4 4 0 0 1-.5-7.97A5 5 0 0 1 16.2 8.1 4.5 4.5 0 0 1 17.5 17H7Z"/></svg>',
  'readwell': '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5v-13Z"/><path d="M20 5.5C20 4.7 19.3 4 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5v-13Z" opacity=".55"/></svg>',
};

const STATUS_LABELS = { none: '미가입', cancelled: '해지완료', scheduled: '해지 예약' };

let uid = localStorage.getItem('dp_uid');
if (!uid) {
  uid = 'demo-' + Date.now();
  localStorage.setItem('dp_uid', uid);
}
document.getElementById('sessionLabel').textContent = '세션 · ' + uid.slice(-10);

document.getElementById('resetBtn').addEventListener('click', () => {
  uid = 'demo-' + Date.now();
  localStorage.setItem('dp_uid', uid);
  document.getElementById('sessionLabel').textContent = '세션 · ' + uid.slice(-10);
  loadSubscriptions();
});

function siteHref(servicePath) {
  return '/' + servicePath + '?uid=' + encodeURIComponent(uid);
}

async function loadSubscriptions() {
  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = '<div class="row"><div class="placeholder">불러오는 중...</div></div>';
  const res = await fetch('/api/subscriptions?uid=' + encodeURIComponent(uid));
  const data = await res.json();
  if (data.error) {
    cardsEl.innerHTML = '<div class="row"><div class="placeholder">' + data.error + '</div></div>';
    return;
  }
  cardsEl.innerHTML = '';
  for (const s of data.subscriptions) {
    cardsEl.appendChild(renderRow(s));
  }
  document.getElementById('sectionTitle').textContent = `내 구독 (${data.subscriptions.length})`;
  document.getElementById('summaryTotal').textContent = data.summary.totalMonthly.toLocaleString() + '원';
  document.getElementById('summarySoonest').textContent = data.summary.soonest
    ? `${data.summary.soonest.name} · ${data.summary.soonest.daysUntilBilling}일 뒤`
    : '없음';
  maybeShowSuggestModal(data.subscriptions);
}

// --- proactive "해지하마가 먼저 물어보는" popup ---
function maybeShowSuggestModal(subscriptions) {
  if (sessionStorage.getItem('dp_suggested')) return;
  const target = subscriptions.find((s) => s.suggestCancel);
  if (!target) return;
  sessionStorage.setItem('dp_suggested', '1');

  const modal = document.getElementById('suggestModal');
  document.getElementById('modalTitle').textContent =
    `${target.suggestionText} 해지하마가 대신 해지해드릴까요?`;

  document.getElementById('modalYesBtn').href = siteHref(target.path);
  document.getElementById('modalNoBtn').onclick = () => {
    modal.classList.add('hidden');
  };
  modal.classList.remove('hidden');
}

function renderRow(s) {
  const div = document.createElement('div');
  div.className = 'row';
  const isActive = s.status === 'active';
  const urgent = isActive && s.daysUntilBilling <= 3;
  const rightHtml = isActive
    ? `<span class="dday ${urgent ? 'urgent' : ''}">${s.daysUntilBilling === 0 ? '오늘 결제' : s.daysUntilBilling + '일 뒤'}</span>`
    : `<span class="row-status-tag">${STATUS_LABELS[s.status] || s.status}</span>`;
  const icon = ICONS[s.path] || '';
  const href = siteHref(s.path);
  div.innerHTML = `
    <div class="row-top">
      <a class="row-link" href="${href}">
        <div class="avatar" style="background:${s.accent}1f;color:${s.accent}">${icon}</div>
        <div class="row-id">
          <div class="row-name">${s.name}</div>
          <div class="row-sub">${s.price.toLocaleString()}원 · 월간 · 이번 달 ${s.usageThisMonth}회 사용</div>
        </div>
        <span class="row-go">&rsaquo;</span>
      </a>
      <div class="row-right">${rightHtml}</div>
    </div>
    ${s.suggestionText ? `<div class="insight">${s.suggestionText}</div>` : ''}
    ${s.note ? `<div class="note-line">최근 처리 기록 · ${s.note}</div>` : ''}
    <div class="actions">
      <a class="site-link" href="${href}">사이트에서 확인하기 &rsaquo;</a>
    </div>
  `;
  return div;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

loadSubscriptions();
</script>
</body>
</html>
