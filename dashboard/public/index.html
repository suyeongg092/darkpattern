


<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해지하마</title>
<link rel="icon" type="image/png" href="/icon01.png">
<style>
  :root {
    --bg: #faf8f4;
    --surface: #ffffff;
    --surface-2: #f2ede1;
    --border: #e2dbc9;
    --ink: #241f18;
    --ink-2: #55503f;
    --muted: #766e5c;
    --accent: #0f9c8a;
    --accent-weak: rgba(15,156,138,.12);
    --detector: #7048e8;
    --detector-weak: rgba(112,72,232,.12);
    --success: #12915a;
    --success-weak: rgba(18,145,90,.12);
    --warning: #b3690a;
    --warning-weak: rgba(179,105,10,.12);
    --danger: #d1293f;
    --danger-weak: rgba(209,41,63,.13);
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard,
      "Apple SD Gothic Neo", "Malgun Gothic", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); margin: 0;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px 60px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px;
  }
  .brand-row { display: flex; align-items: center; gap: 10px; }
  .wordmark { font-size: 14px; font-weight: 800; color: var(--ink); letter-spacing: -0.1px; }
  .status-pill {
    font-size: 10.5px; font-weight: 700; color: var(--success); background: var(--success-weak);
    padding: 3px 9px; border-radius: 999px; display: flex; align-items: center; gap: 5px;
  }
  .status-pill .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--success); }
  .session-box { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
  .reset-link {
    font-size: 12px; color: var(--ink-2); background: none; border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  .reset-link:hover { border-color: var(--accent); color: var(--accent); }

  .page-head { padding: 4px 0 20px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .page-title { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; }
  .page-sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

  .attack-toggle {
    display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; cursor: pointer; user-select: none;
  }
  .attack-toggle input { display: none; }
  .attack-toggle .dot2 { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex: none; }
  .attack-toggle input:checked ~ .dot2 { background: var(--danger); }
  .attack-toggle.on { border-color: var(--danger); color: var(--danger); background: var(--danger-weak); }

  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; max-width: 500px; }
  .summary-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
  }
  .summary-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .summary-value { font-size: 19px; font-weight: 800; margin-top: 5px; letter-spacing: -0.2px; color: var(--accent); }
  .summary-value.small { font-size: 14px; color: var(--ink); }

  /* --- live screen --- */
  .screen-section { margin-bottom: 24px; }
  .screen-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
  .screen-title-group { display: flex; align-items: baseline; gap: 8px; }
  .panel-title {
    font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-2);
  }
  .screen-sub { font-size: 11.5px; color: var(--muted); }
  .screen-controls { display: flex; align-items: center; gap: 10px; }

  .ghost-btn {
    font-size: 12px; color: var(--ink-2); background: none; border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .ghost-btn:hover { border-color: var(--accent); color: var(--accent); }
  .ghost-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-weak); }

  .device-toggle {
    display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
  }
  .device-btn {
    font-size: 12px; color: var(--ink-2); background: var(--surface); border: none;
    padding: 5px 12px; cursor: pointer;
  }
  .device-btn:first-child { border-right: 1px solid var(--border); }
  .device-btn.active { background: var(--accent); color: #06201d; font-weight: 700; }

  .screen-layout { display: grid; grid-template-columns: 1fr 1.05fr; gap: 20px; align-items: start; }
  @media (max-width: 860px) { .screen-layout { grid-template-columns: 1fr; } }

  .screen {
    width: 100%; aspect-ratio: 3 / 4; max-height: 520px; border-radius: 10px; background: #000;
    border: 1px solid var(--border); margin: 0 auto;
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .screen img { width: 100%; height: 100%; object-fit: contain; display: none; }
  .screen img.on { display: block; }
  .screen-placeholder { color: var(--muted); font-size: 13px; text-align: center; padding: 0 20px; line-height: 1.7; }
  .screen-badge {
    position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 700; color: #fff;
    background: rgba(15,156,138,.92); padding: 4px 10px; border-radius: 5px; display: none;
    align-items: center; gap: 5px; z-index: 2;
  }
  .screen-badge.detector { background: rgba(112,72,232,.92); }
  .screen-badge.past { background: rgba(154,161,171,.92); }
  .screen-badge.on { display: flex; }
  .screen-badge .live-dot { background: #fff; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .2; } }

  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; min-height: 300px; max-height: 520px; overflow-y: auto;
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .panel-sub { font-size: 11.5px; color: var(--muted); margin-bottom: 14px; }

  .placeholder { font-size: 12.5px; color: var(--muted); line-height: 1.6; padding: 4px 2px; }

  .steps { position: relative; }
  .step { display: flex; gap: 10px; padding-bottom: 14px; position: relative; }
  .step:not(:last-child)::before {
    content: ""; position: absolute; left: 9px; top: 22px; bottom: -2px; width: 1.5px;
    background: var(--border);
  }
  .step-icon {
    width: 19px; height: 19px; border-radius: 4px; flex: none; margin-top: 1px;
    display: flex; align-items: center; justify-content: center; font-size: 11px;
    background: var(--surface-2); color: var(--muted); font-weight: 700; border: 1px solid var(--border);
  }
  .step-icon.ok { background: var(--success-weak); color: var(--success); border-color: transparent; }
  .step-icon.bad { background: var(--danger-weak); color: var(--danger); border-color: transparent; }
  .step-icon.det { background: var(--detector-weak); color: var(--detector); border-color: transparent; }
  .step-body { flex: 1; min-width: 0; }
  .step-label { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .step-detail {
    margin-top: 3px; font-size: 11px; color: var(--ink-2); word-break: break-all;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; line-height: 1.5;
    background: var(--surface-2); border-radius: 6px; padding: 5px 8px; border: 1px solid var(--border);
  }
  .step-tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
  .step-waiting { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .ring {
    width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border);
    border-top-color: var(--accent); animation: spin .7s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .verdict {
    margin-top: 8px; padding: 12px 14px; border-radius: 8px; font-size: 12.5px; line-height: 1.5;
    border: 1px solid transparent;
  }
  .verdict-title { font-weight: 800; font-size: 13px; margin-bottom: 2px; }
  .verdict-ok { background: var(--success-weak); color: var(--success); }
  .verdict-blocked { background: var(--warning-weak); color: var(--warning); }
  .verdict-violation { background: var(--danger-weak); color: var(--danger); }
  .verdict-detector { background: var(--detector-weak); color: var(--detector); }

  .pattern-tag {
    display: inline-block; font-size: 10.5px; font-weight: 700;
    padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,.08); color: inherit;
  }

  .history-panel {
    margin-top: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px; max-height: 260px; overflow-y: auto;
  }
  .history-panel.hidden { display: none; }
  .history-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px; cursor: pointer;
  }
  .history-item:hover { background: var(--surface-2); }
  .history-item .h-verdict-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .h-ok { background: var(--success); }
  .h-blocked { background: var(--warning); }
  .h-violation { background: var(--danger); }
  .h-detector { background: var(--detector); }
  .history-item .h-name { font-size: 12.5px; font-weight: 600; flex: 1; min-width: 0; }
  .history-item .h-meta { font-size: 11px; color: var(--muted); }
  .history-empty { font-size: 12px; color: var(--muted); padding: 10px; }

  .section-label {
    font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
    margin: 0 0 10px 2px;
  }

  .list {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden;
  }
  .row { padding: 16px 16px; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: none; }

  .row-top { display: flex; align-items: center; gap: 12px; }
  .row-link {
    display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0;
    text-decoration: none; color: inherit;
  }
  .avatar {
    width: 38px; height: 38px; border-radius: 10px; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .avatar svg { width: 19px; height: 19px; }
  .row-id { flex: 1; min-width: 0; }
  .row-name { font-weight: 700; font-size: 14px; }
  .row-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .row-go { color: var(--border); font-size: 20px; line-height: 1; flex: none; }
  .row-right { text-align: right; flex: none; }
  .dday {
    font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 6px;
    background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border);
  }
  .dday.urgent { background: var(--danger-weak); color: var(--danger); border-color: transparent; }
  .row-status-tag { font-size: 11px; color: var(--muted); font-weight: 600; }

  .insight { margin-top: 8px; font-size: 12px; color: var(--ink-2); }
  .note-line { margin-top: 6px; font-size: 11px; color: var(--warning); }

  .actions { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn-primary {
    font-size: 12px; font-weight: 700; padding: 8px 14px; border-radius: 7px;
    border: 1px solid var(--accent); background: var(--accent); color: #06201d; cursor: pointer;
  }
  .btn-primary:disabled { opacity: .35; cursor: default; }
  .btn-primary:hover:not(:disabled) { background: #26c4b0; }
  .site-link {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    padding: 8px 14px; border-radius: 7px; border: 1px solid var(--border);
    background: none; color: var(--ink-2); text-decoration: none;
  }
  .site-link:hover { border-color: var(--accent); color: var(--accent); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 28px 24px; max-width: 360px; text-align: center;
  }
  .modal-mascot { font-size: 44px; margin-bottom: 10px; }
  .modal-title { font-size: 14px; line-height: 1.6; color: var(--ink); margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 10px; justify-content: center; }
  .modal-actions .btn-primary { flex: 1; padding: 10px 14px; }
  .modal-actions .ghost-btn { flex: 1; justify-content: center; padding: 10px 14px; }

  .hippo-roam { display: inline-block; animation: hippo-bounce .6s ease-in-out infinite; }
  @keyframes hippo-bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-3px) rotate(-6deg); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand-row">
      <img src="/icon01.png" alt="해지하마" style="width:28px;height:28px;border-radius:7px;">
      <div class="wordmark">해지하마</div>
      <div class="status-pill"><span class="dot"></span>모니터링 중</div>
    </div>
    <div class="session-box">
      <span id="sessionLabel" class="mono"></span>
      <button class="reset-link" id="resetBtn">새 세션</button>
    </div>
  </div>

  <div class="page-head">
    <div>
      <div class="page-title">구독 무결성 모니터링</div>
      <div class="page-sub">다크패턴 뚫고, 위조는 잡아내는 AI 해지 Agent</div>
    </div>
    <label class="attack-toggle" id="attackToggleLabel">
      <input type="checkbox" id="attackToggle">
      <span class="dot2"></span>
      공격 시뮬레이션(ADI) 걸고 실행
    </label>
  </div>

  <div class="summary" id="summary">
    <div class="summary-box">
      <div class="summary-label">이번 달 구독료</div>
      <div class="summary-value" id="summaryTotal">-</div>
    </div>
    <div class="summary-box">
      <div class="summary-label">다가오는 결제</div>
      <div class="summary-value small" id="summarySoonest">-</div>
    </div>
  </div>

  <div class="screen-section">
    <div class="screen-head">
      <div class="screen-title-group">
        <div class="panel-title">실행 화면</div>
        <div class="screen-sub" id="screenModeLabel">Agent가 실제로 보고 있는 화면을 그대로 보여줍니다</div>
      </div>
      <div class="screen-controls">
        <div class="device-toggle" id="deviceToggle">
          <button class="device-btn active" data-device="pc" type="button">PC</button>
          <button class="device-btn" data-device="mobile" type="button">모바일</button>
        </div>
        <button class="ghost-btn" id="historyBtn">지난 기록 (<span id="historyCount">0</span>)</button>
      </div>
    </div>
    <div class="screen-layout">
      <div>
        <div class="screen" id="screen">
          <div class="screen-badge" id="screenBadge"><span class="live-dot"></span>실시간</div>
          <img id="screenImg" alt="agent live view">
          <div class="screen-placeholder" id="screenPlaceholder">아래 목록에서 "🦛 해지하기"를 누르면<br>여기에 실제 다크패턴 사이트 화면이 실시간으로 나타납니다</div>
        </div>
        <div class="history-panel hidden" id="historyPanel">
          <div class="history-empty">아직 실행 기록이 없어요.</div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title" id="pipelineTitle">실행 파이프라인</div>
        </div>
        <div class="panel-sub" id="pipelineSub">왼쪽에서 실행 버튼을 누르면 여기에 단계별 로그가 표시됩니다.</div>
        <div id="logPanel">
          <div class="placeholder">대기 중...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="section-label" id="sectionTitle">내 구독</div>
  <div class="list" id="cards">
    <div class="row"><div class="placeholder">불러오는 중...</div></div>
  </div>
</div>

<div class="modal-overlay hidden" id="suggestModal">
  <div class="modal-box">
    <div class="modal-mascot">🦛</div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-actions">
      <button class="btn-primary" id="modalYesBtn">해지하마에게 맡기기</button>
      <button class="ghost-btn" id="modalNoBtn">괜찮아요</button>
    </div>
  </div>
</div>

<script>
const ICONS = {
  'streamnow': '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4.5a1 1 0 0 1 1.5-.87l12 7.5a1 1 0 0 1 0 1.74l-12 7.5A1 1 0 0 1 5 19.5v-15Z"/></svg>',
  'ordernow-club': '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 8h9l1.2 11.2a2 2 0 0 1-2 2.1H8.3a2 2 0 0 1-2-2.1L7.5 8Z"/><path d="M9 8a3 3 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  'supercart-plus': '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.2 9h11.6l-1 9.8a2.2 2.2 0 0 1-2.2 2H9.4a2.2 2.2 0 0 1-2.2-2L6.2 9Z"/><path d="M9 9a3 3 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9.5" cy="21.2" r="1"/><circle cx="15.5" cy="21.2" r="1"/></svg>',
  'primevault': '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 4.5 6v6.2c0 5 3.2 8.6 7.5 9.8 4.3-1.2 7.5-4.8 7.5-9.8V6L12 2.5Z"/><path d="M9.2 12.3l2 2.1 3.6-4.1" fill="none" stroke="var(--surface)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  'cloudstudio': '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 17a4 4 0 0 1-.5-7.97A5 5 0 0 1 16.2 8.1 4.5 4.5 0 0 1 17.5 17H7Z"/></svg>',
  'readwell': '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5v-13Z"/><path d="M20 5.5C20 4.7 19.3 4 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5v-13Z" opacity=".55"/></svg>',
};

const STATUS_LABELS = { none: '미가입', cancelled: '해지완료', scheduled: '해지 예약' };
const DARK_PATTERN_TYPES = {
  'ordernow-club': '몰래 재활성화형', 'supercart-plus': '액션 위장형',
  'primevault': '제출 경로 바꿔치기형', 'cloudstudio': '청구액 불일치형', 'streamnow': '표시 결과 불일치형',
};

let uid = localStorage.getItem('dp_uid');
if (!uid) {
  uid = 'demo-' + Date.now();
  localStorage.setItem('dp_uid', uid);
}
document.getElementById('sessionLabel').textContent = '세션 · ' + uid.slice(-10);

document.getElementById('resetBtn').addEventListener('click', () => {
  uid = 'demo-' + Date.now();
  localStorage.setItem('dp_uid', uid);
  document.getElementById('sessionLabel').textContent = '세션 · ' + uid.slice(-10);
  loadSubscriptions();
  loadHistory();
});

// --- attack toggle (applies to whichever run button is clicked next) ---
const attackToggle = document.getElementById('attackToggle');
const attackToggleLabel = document.getElementById('attackToggleLabel');
attackToggle.addEventListener('change', () => {
  attackToggleLabel.classList.toggle('on', attackToggle.checked);
});

// --- device toggle: PC/모바일 뷰포트로 실행 (applies to whichever run button is clicked next) ---
let device = 'pc';
document.getElementById('deviceToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('.device-btn');
  if (!btn) return;
  device = btn.dataset.device;
  document.querySelectorAll('.device-btn').forEach((b) => b.classList.toggle('active', b === btn));
});

function siteHref(servicePath) {
  return '/' + servicePath + '?uid=' + encodeURIComponent(uid);
}

// --- history panel ---
const historyPanel = document.getElementById('historyPanel');
const historyBtn = document.getElementById('historyBtn');
let historyOpen = false;
historyBtn.addEventListener('click', () => {
  historyOpen = !historyOpen;
  historyBtn.classList.toggle('active', historyOpen);
  historyPanel.classList.toggle('hidden', !historyOpen);
  if (historyOpen) loadHistory();
});

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const min = Math.floor(diff / 60000);
  if (min < 1) return '방금 전';
  if (min < 60) return `${min}분 전`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}시간 전`;
  return `${Math.floor(hr / 24)}일 전`;
}

async function loadHistory() {
  const res = await fetch('/api/history?uid=' + encodeURIComponent(uid));
  const data = await res.json();
  document.getElementById('historyCount').textContent = data.history.length;
  if (!historyOpen) return;
  if (!data.history.length) {
    historyPanel.innerHTML = '<div class="history-empty">아직 실행 기록이 없어요. 실행 기록은 7일간 보관돼요.</div>';
    return;
  }
  historyPanel.innerHTML = '';
  for (const h of data.history) {
    const item = document.createElement('div');
    item.className = 'history-item';
    let dotClass, label;
    if (h.kind === 'detector') {
      dotClass = 'h-detector';
      label = h.result && h.result.success ? '우회 성공' : '실패/붙잡힘';
    } else {
      dotClass = h.verdict.blocked ? 'h-blocked' : h.verdict.integrityViolation ? 'h-violation' : 'h-ok';
      label = h.verdict.blocked ? '사전 차단' : h.verdict.integrityViolation ? '위반 탐지' : '정상 완료';
    }
    const kindLabel = h.kind === 'detector' ? '🔍 탐지' : '🛡️ 무결성';
    item.innerHTML = `
      <span class="h-verdict-dot ${dotClass}"></span>
      <span class="h-name">${kindLabel} · ${escapeHtml(h.serviceName)}${h.attack ? ' · 공격' : ''}</span>
      <span class="h-meta">${label} · ${timeAgo(h.at)}</span>
    `;
    item.addEventListener('click', () => loadHistoryDetail(h.id));
    historyPanel.appendChild(item);
  }
}

async function loadHistoryDetail(id) {
  const res = await fetch(`/api/history/${id}?uid=` + encodeURIComponent(uid));
  const data = await res.json();
  if (data.error) {
    alert(data.error);
    return;
  }
  const screenImg = document.getElementById('screenImg');
  const screenPlaceholder = document.getElementById('screenPlaceholder');
  const screenBadge = document.getElementById('screenBadge');
  if (data.lastFrame) {
    screenImg.src = 'data:image/jpeg;base64,' + data.lastFrame;
    screenImg.classList.add('on');
    screenPlaceholder.style.display = 'none';
  }
  screenBadge.className = 'screen-badge on past' + (data.kind === 'detector' ? ' detector' : '');
  screenBadge.innerHTML = `지난 기록 · ${timeAgo(data.at)}`;
  if (data.kind === 'detector') {
    setPipelineLabel('detector');
    renderDetectorLog(data.logs, data.result, data.integrityCheck);
  } else {
    setPipelineLabel('integrity');
    renderIntegrityLog(data.logs, data.verdict);
  }
  historyOpen = false;
  historyBtn.classList.remove('active');
  historyPanel.classList.add('hidden');
}

async function loadSubscriptions() {
  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = '<div class="row"><div class="placeholder">불러오는 중...</div></div>';
  const res = await fetch('/api/subscriptions?uid=' + encodeURIComponent(uid));
  const data = await res.json();
  if (data.error) {
    cardsEl.innerHTML = '<div class="row"><div class="placeholder">' + data.error + '</div></div>';
    return;
  }
  cardsEl.innerHTML = '';
  for (const s of data.subscriptions) {
    cardsEl.appendChild(renderRow(s));
  }
  document.getElementById('sectionTitle').textContent = `내 구독 (${data.subscriptions.length})`;
  document.getElementById('summaryTotal').textContent = data.summary.totalMonthly.toLocaleString() + '원';
  document.getElementById('summarySoonest').textContent = data.summary.soonest
    ? `${data.summary.soonest.name} · ${data.summary.soonest.daysUntilBilling}일 뒤`
    : '없음';
  maybeShowSuggestModal(data.subscriptions);
}

// --- proactive "해지하마가 먼저 물어보는" popup ---
function maybeShowSuggestModal(subscriptions) {
  if (sessionStorage.getItem('dp_suggested')) return;
  const target = subscriptions.find((s) => s.suggestCancel);
  if (!target) return;
  sessionStorage.setItem('dp_suggested', '1');

  const modal = document.getElementById('suggestModal');
  document.getElementById('modalTitle').textContent =
    `${target.suggestionText} 해지하마가 대신 해지해드릴까요?`;

  const rowEl = document.querySelector(`button[data-service="${target.path}"][data-kind="combined"]`)?.closest('.row');
  document.getElementById('modalYesBtn').onclick = () => {
    modal.classList.add('hidden');
    if (rowEl) runCombined(target.path, rowEl);
  };
  document.getElementById('modalNoBtn').onclick = () => {
    modal.classList.add('hidden');
  };
  modal.classList.remove('hidden');
}

function renderRow(s) {
  const div = document.createElement('div');
  div.className = 'row';
  const isActive = s.status === 'active';
  const urgent = isActive && s.daysUntilBilling <= 3;
  const rightHtml = isActive
    ? `<span class="dday ${urgent ? 'urgent' : ''}">${s.daysUntilBilling === 0 ? '오늘 결제' : s.daysUntilBilling + '일 뒤'}</span>`
    : `<span class="row-status-tag">${STATUS_LABELS[s.status] || s.status}</span>`;
  const icon = ICONS[s.path] || '';
  const href = siteHref(s.path);
  div.innerHTML = `
    <div class="row-top">
      <a class="row-link" href="${href}">
        <div class="avatar" style="background:${s.accent}1f;color:${s.accent}">${icon}</div>
        <div class="row-id">
          <div class="row-name">${s.name}</div>
          <div class="row-sub">${s.price.toLocaleString()}원 · 월간 · 이번 달 ${s.usageThisMonth}회 사용</div>
        </div>
        <span class="row-go">&rsaquo;</span>
      </a>
      <div class="row-right">${rightHtml}</div>
    </div>
    ${s.suggestionText ? `<div class="insight">${s.suggestionText}</div>` : ''}
    ${s.note ? `<div class="note-line">최근 처리 기록 · ${s.note}</div>` : ''}
    <div class="actions">
      <button class="btn-primary" data-service="${s.path}" data-kind="combined" ${!isActive ? 'disabled' : ''}>🦛 해지하기</button>
      <a class="site-link" href="${href}">사이트에서 확인하기 &rsaquo;</a>
    </div>
  `;
  div.querySelector('button[data-kind="combined"]').addEventListener('click', () => runCombined(s.path, div));
  return div;
}

function setPipelineLabel(kind) {
  const screenModeLabel = document.getElementById('screenModeLabel');
  const pipelineTitle = document.getElementById('pipelineTitle');
  const pipelineSub = document.getElementById('pipelineSub');
  if (kind === 'detector') {
    screenModeLabel.textContent = 'agent/detector(team_agent)가 다크패턴을 판단하며 클릭하는 화면입니다';
    pipelineTitle.textContent = '다크패턴 판단 로그';
    pipelineSub.textContent = '매 페이지마다 무엇을 다크패턴으로 보고 어떤 후보를 왜 눌렀는지 표시합니다.';
  } else {
    screenModeLabel.textContent = 'agent가 실제로 보고 있는 화면을 그대로 보여줍니다';
    pipelineTitle.textContent = '실행 파이프라인';
    pipelineSub.textContent = '정책 변환부터 사후 검증까지, 무결성 판단 단계입니다.';
  }
}

function endRun(rowEl) {
  rowEl.querySelectorAll('button').forEach((b) => (b.disabled = false));
}

// 버튼 하나(해지하기)로 판단→실행→검증을 한 흐름으로 실행한다: agent/detector(Python)가
// 다크패턴을 판단하며 실제로 클릭해 해지를 끝내고, 그 직후 같은 요청 안에서 서버가
// agent/의 검증 로직(policyEngine.js)으로 백엔드 실제 상태를 재조회해 대조한다.
// 브라우저를 다시 열어 재실행하지 않으므로 "이미 처리된 화면에서 멈추는" 문제가 없다.
function runCombined(service, rowEl) {
  const attack = attackToggle.checked;
  rowEl.querySelectorAll('button').forEach((b) => (b.disabled = true));

  const screenImg = document.getElementById('screenImg');
  const screenPlaceholder = document.getElementById('screenPlaceholder');
  const screenBadge = document.getElementById('screenBadge');
  const logPanel = document.getElementById('logPanel');

  screenImg.classList.remove('on');
  screenPlaceholder.style.display = 'block';
  screenPlaceholder.textContent = '연결 중...';
  screenBadge.className = 'screen-badge on detector';
  screenBadge.innerHTML = '<span class="live-dot"></span>실시간';
  setPipelineLabel('detector');
  logPanel.innerHTML = '';
  const stepsEl = document.createElement('div');
  stepsEl.className = 'steps';
  logPanel.appendChild(stepsEl);
  const waitingEl = document.createElement('div');
  waitingEl.className = 'step-waiting';
  waitingEl.innerHTML = '<span class="ring"></span><span class="hippo-roam">🦛</span> 다크패턴을 판단하는 중...';
  logPanel.appendChild(waitingEl);

  const qs = new URLSearchParams({ service, uid, attack: attack ? '1' : '0', device });
  const es = new EventSource('/api/detector-stream?' + qs.toString());
  let sawProgress = false; // frame이든 step이든 하나라도 왔으면 detector가 실제로 동작한 것
  let handedOff = false; // 무결성 검증으로 넘어간 뒤에는 이 es의 나머지 메시지를 무시한다

  const fallbackToIntegrity = () => {
    handedOff = true;
    es.close();
    screenPlaceholder.style.display = 'block';
    screenPlaceholder.textContent = '연결 중...';
    const note = document.createElement('div');
    note.className = 'placeholder';
    note.textContent = '이 환경에서는 다크패턴 판단 단계를 지원하지 않아 무결성 검증으로 바로 진행합니다.';
    logPanel.appendChild(note);
    runIntegrityFallback(service, attack, rowEl, screenImg, screenPlaceholder, screenBadge, logPanel);
  };

  es.onmessage = (evt) => {
    if (handedOff) return;
    const msg = JSON.parse(evt.data);
    if (msg.type === 'frame') {
      sawProgress = true;
      screenPlaceholder.style.display = 'none';
      screenImg.src = 'data:image/jpeg;base64,' + msg.data;
      screenImg.classList.add('on');
    } else if (msg.type === 'detector-step') {
      sawProgress = true;
      appendDetectorStep(stepsEl, msg.step);
      waitingEl.innerHTML = '<span class="ring"></span><span class="hippo-roam">🦛</span> 다음 화면 판단 중...';
      logPanel.appendChild(waitingEl);
    } else if (msg.type === 'detector-result') {
      waitingEl.remove();
      logPanel.appendChild(detectorVerdictNode(msg.result));
    } else if (msg.type === 'integrity-check') {
      logPanel.appendChild(integrityCheckNode(msg.check));
    } else if (msg.type === 'error') {
      waitingEl.remove();
      if (!sawProgress) {
        fallbackToIntegrity();
        return;
      }
      const note = document.createElement('div');
      note.className = 'placeholder';
      note.textContent = '실행 중 문제가 발생했습니다.';
      logPanel.appendChild(note);
    } else if (msg.type === 'done') {
      screenBadge.classList.remove('on');
      es.close();
      endRun(rowEl);
      loadSubscriptions();
      loadHistory();
    }
  };
  es.onerror = () => {
    if (handedOff) return;
    waitingEl.remove();
    if (!sawProgress) {
      fallbackToIntegrity();
      return;
    }
    screenBadge.classList.remove('on');
    es.close();
    endRun(rowEl);
  };
}

// detector가 이 환경에서 아예 실행되지 못했을 때(예: Python 미설치 배포본)의
// 대체 경로 — agent/(JS)만으로 실행+검증을 끝까지 완료한다.
function runIntegrityFallback(service, attack, rowEl, screenImg, screenPlaceholder, screenBadge, logPanel) {
  setPipelineLabel('integrity');
  const stepsEl = document.createElement('div');
  stepsEl.className = 'steps';
  logPanel.appendChild(stepsEl);
  const waitingEl = document.createElement('div');
  waitingEl.className = 'step-waiting';
  waitingEl.innerHTML = '<span class="ring"></span><span class="hippo-roam">🦛</span> 해지하마가 출동 중...';
  logPanel.appendChild(waitingEl);

  const qs = new URLSearchParams({ service, uid, attack: attack ? '1' : '0', device });
  const es = new EventSource('/api/run-stream?' + qs.toString());

  es.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.type === 'frame') {
      screenPlaceholder.style.display = 'none';
      screenImg.src = 'data:image/jpeg;base64,' + msg.data;
      screenImg.classList.add('on');
    } else if (msg.type === 'log') {
      appendIntegrityStep(stepsEl, msg.step, msg.detail);
      waitingEl.innerHTML = '<span class="ring"></span><span class="hippo-roam">🦛</span> 해지하마가 확인하는 중...';
      logPanel.appendChild(waitingEl);
    } else if (msg.type === 'verdict') {
      waitingEl.remove();
      logPanel.appendChild(verdictNode(msg.verdict));
    } else if (msg.type === 'error') {
      waitingEl.remove();
      const errEl = document.createElement('div');
      errEl.className = 'placeholder';
      errEl.textContent = '오류: ' + msg.message;
      logPanel.appendChild(errEl);
    } else if (msg.type === 'done') {
      screenBadge.classList.remove('on');
      es.close();
      endRun(rowEl);
      loadSubscriptions();
      loadHistory();
    }
  };
  es.onerror = () => {
    waitingEl.remove();
    screenPlaceholder.style.display = 'block';
    screenPlaceholder.textContent = '연결이 끊어졌습니다. 다시 시도해주세요.';
    screenBadge.classList.remove('on');
    es.close();
    endRun(rowEl);
  };
}

function integrityCheckNode(check) {
  const el = document.createElement('div');
  if (check.ok) {
    el.className = 'verdict verdict-ok';
    el.innerHTML = `<div class="verdict-title">🦛 무결성 재확인 통과!</div>백엔드 실제 상태를 다시 조회해 대조함. 화면 문구가 아니라 실제 처리 결과 기준.`;
  } else {
    el.className = 'verdict verdict-violation';
    el.innerHTML = `<div class="verdict-title">🦛 해지하마가 속임수 잡아냄!</div>${escapeHtml(check.reason)}`;
  }
  return el;
}

function appendIntegrityStep(container, stepText, detail) {
  const step = document.createElement('div');
  step.className = 'step';
  const isBad = /🛑/.test(stepText);
  const isGood = /✅/.test(stepText);
  const iconClass = isBad ? 'bad' : isGood ? 'ok' : '';
  const iconGlyph = isBad ? '✕' : isGood ? '✓' : '';
  step.innerHTML = `
    <div class="step-icon ${iconClass}">${iconGlyph}</div>
    <div class="step-body">
      <div class="step-label">${escapeHtml(stepText.replace(/^\d+\.\s*/, '').replace(/[🛑✅]\s*/, ''))}</div>
      ${detail ? `<div class="step-detail">${escapeHtml(detail)}</div>` : ''}
    </div>`;
  container.appendChild(step);
}

function renderIntegrityLog(logs, verdict) {
  const logPanel = document.getElementById('logPanel');
  logPanel.innerHTML = '';
  const stepsEl = document.createElement('div');
  stepsEl.className = 'steps';
  logPanel.appendChild(stepsEl);
  for (const entry of logs) appendIntegrityStep(stepsEl, entry.step, entry.detail);
  logPanel.appendChild(verdictNode(verdict));
}

function verdictNode(v) {
  const verdictEl = document.createElement('div');
  const patternType = DARK_PATTERN_TYPES[v.service];
  const patternTag = patternType ? `<div style="margin-top:6px"><span class="pattern-tag">${escapeHtml(patternType)}</span></div>` : '';
  if (v.blocked) {
    verdictEl.className = 'verdict verdict-blocked';
    verdictEl.innerHTML = `<div class="verdict-title">🦛 해지하마, 수상해서 스톱!</div>${escapeHtml(v.reason)}${patternTag}`;
  } else if (v.integrityViolation) {
    verdictEl.className = 'verdict verdict-violation';
    verdictEl.innerHTML = `<div class="verdict-title">🦛 해지하마가 속임수 잡아냄!</div>${escapeHtml(v.reason)}${patternTag}`;
  } else {
    verdictEl.className = 'verdict verdict-ok';
    verdictEl.innerHTML = `<div class="verdict-title">검증하마! 해지 완료!</div>무결성 검증 통과 · ${v.durationMs}ms`;
  }
  return verdictEl;
}

function appendDetectorStep(container, step) {
  const div = document.createElement('div');
  div.className = 'step';
  const detections = step.detections || [];
  const tags = detections
    .map((d) => `<span class="pattern-tag" style="background:var(--detector-weak);color:var(--detector)">${escapeHtml(d.pattern)}</span>`)
    .join('');
  div.innerHTML = `
    <div class="step-icon det">${step.step}</div>
    <div class="step-body">
      <div class="step-label">${escapeHtml(step.action || '')}</div>
      ${step.reasoning ? `<div class="step-detail">${escapeHtml(step.reasoning)}</div>` : ''}
      ${tags ? `<div class="step-tags">${tags}</div>` : ''}
    </div>`;
  container.appendChild(div);
}

function renderDetectorLog(logs, result, integrityCheck) {
  const logPanel = document.getElementById('logPanel');
  logPanel.innerHTML = '';
  const stepsEl = document.createElement('div');
  stepsEl.className = 'steps';
  logPanel.appendChild(stepsEl);
  for (const step of logs) appendDetectorStep(stepsEl, step);
  logPanel.appendChild(detectorVerdictNode(result));
  if (integrityCheck) logPanel.appendChild(integrityCheckNode(integrityCheck));
}

function detectorVerdictNode(result) {
  const el = document.createElement('div');
  el.className = 'verdict verdict-detector';
  const count = (result.detections || []).length;
  if (result.success) {
    el.innerHTML = `<div class="verdict-title">🔍 다크패턴 ${count}건 판단하며 해지 완료!</div>${result.stepCount}단계 만에 실제 상태(status: ${escapeHtml(result.finalStatus && result.finalStatus.status || '-')})까지 재확인함.`;
  } else {
    el.innerHTML = `<div class="verdict-title">🔍 붙잡힘 — 클릭 가능한 후보 없음</div>화면에서 판단한 다크패턴 ${count}건은 기록됐지만, 이 단계는 우회하지 못했음.`;
  }
  return el;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

loadSubscriptions();
loadHistory();
</script>
